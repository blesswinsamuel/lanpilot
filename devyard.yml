# Local development for lanpilot.
#
# Usage (from repo root):
#
#   devyard start -f    # foreground; Ctrl-C stops
#   devyard start       # detached
#   devyard logs -f
#   devyard stop
#
# Tasks:
#   devyard run generate
#   devyard run deploy
#   devyard run logs
#   devyard run stop
#   devyard run test

name: lanpilot
primary: web

services:
  web:
    run: bun run dev
    dir: ./web
    port: 9157
    build:
      run: bun install
      sources: [web/package.json, web/bun.lock]
    restart: always

tasks:
  generate: task go-generate
  deploy: task deploy-dev
  logs: task logs-dev
  stop: task stop-dev
  test: go test ./...
